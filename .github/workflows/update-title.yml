name: Update video title

on:
  # Запускается извне: cron-job.org каждые 15 минут вызывает API workflow_dispatch
  # (встроенное расписание GitHub работало с большими задержками).
  # Квота YouTube: 96 запусков x 101 ед. = 9 696 из 10 000 в сутки.
  workflow_dispatch:          # и кнопка ручного запуска во вкладке Actions
    inputs:
      thumbnail:
        description: "Перерисовать превью, даже если число не изменилось"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: update-title
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DO_THUMB: "true"
      FORCE_THUMB: ${{ inputs.thumbnail == true }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install font for thumbnail
        if: env.DO_THUMB == 'true'
        run: fc-list | grep -q LiberationSans-Regular || sudo apt-get install -y -qq fonts-liberation > /dev/null

      - name: Update title (and thumbnail)
        run: |
          if [ "$FORCE_THUMB" = "true" ]; then
            python views_title.py --once --thumbnail --force-thumbnail
          else
            python views_title.py --once --thumbnail
          fi
        env:
          YT_TOKEN: ${{ secrets.YT_TOKEN }}

      - name: Save thumbnail for viewing
        if: env.DO_THUMB == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: thumbnail
          path: thumbnail.png
          retention-days: 3
          if-no-files-found: ignore
