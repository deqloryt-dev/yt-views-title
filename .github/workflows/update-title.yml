name: Update video title

on:
  schedule:
    - cron: "*/10 * * * *"   # заголовок каждые 10 минут (GitHub иногда запускает с опозданием)
    - cron: "5 * * * *"      # раз в час (в :05) — заголовок + превью
  workflow_dispatch:          # кнопка ручного запуска во вкладке Actions
    inputs:
      thumbnail:
        description: "Обновить и превью"
        type: boolean
        default: false

permissions:
  contents: write             # нужно только для ежемесячного keepalive-коммита

concurrency:
  group: update-title
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DO_THUMB: ${{ github.event.schedule == '5 * * * *' || inputs.thumbnail == true }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install font for thumbnail
        if: env.DO_THUMB == 'true'
        run: sudo apt-get install -y -qq fonts-ibm-plex > /dev/null

      - name: Update title (and thumbnail)
        run: |
          if [ "$DO_THUMB" = "true" ]; then
            python views_title.py --once --thumbnail
          else
            python views_title.py --once
          fi
        env:
          YT_TOKEN: ${{ secrets.YT_TOKEN }}

      - name: Save thumbnail for viewing
        if: env.DO_THUMB == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: thumbnail
          path: thumbnail.png
          retention-days: 3
          if-no-files-found: ignore

      # GitHub отключает расписание в публичных репозиториях после 60 дней без активности.
      # Раз в ~30 дней делаем пустой коммит, чтобы расписание работало вечно.
      - name: Keepalive
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $((now - last)) -gt 2592000 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi
