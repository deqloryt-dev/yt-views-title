name: Debug render (temporary)
on: workflow_dispatch
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow
      - run: sudo apt-get install -y -qq fonts-ibm-plex > /dev/null
      - run: python debug_render.py
      - uses: actions/upload-artifact@v4
        with:
          name: renders
          path: out/
          retention-days: 1
